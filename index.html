<style>
  /* Identity: Raphael Wicki, Local Service mini brand guide V1 (27 Oct 2026).
     Every colour below is from his palette and all text is his Werk Neue Mono.
     The lockup is built by brand-identity/tools/make_web_assets.py; edit the
     template, not index.html. */
  @font-face {
    font-family: "Werk Neue Mono";
    src: url("/fonts/werk-neue-mono.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  :root {
    --black: #000000;
    --white: #ffffff;
    --orange: #eb694b;
    --bg: var(--white);
    --fg: var(--black);
    --dot: var(--orange);
    --gutter: clamp(16px, 4vw, 40px);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: 0 var(--gutter);
    background: var(--bg);
    color: var(--fg);
    font-family: "Werk Neue Mono", ui-monospace, Menlo, monospace;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 0;
  }
  h1 { margin: 0; font-size: 1em; line-height: 0; }
  /* 2.197 = width / height of the lockup, so it also fits short screens */
  .lockup {
    display: block;
    width: min(56vw, 1100px);
    width: min(56vw, 1100px, calc((100svh - 12rem) * 2.197));
    height: auto;
  }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem 1.5rem;
    padding: 1rem 0 calc(1.5rem + env(safe-area-inset-bottom));
    font-size: 0.9375rem;
    line-height: 1.2;
  }
  footer p { margin: 0; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    text-transform: uppercase;
  }
  .dot {
    width: 0.6em;
    height: 0.6em;
    border-radius: 50%;
    background: var(--dot);
    animation: on-air 2.4s ease-in-out infinite;
  }
  @keyframes on-air { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }
  footer a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.25em;
  }
  /* a % width here would size against the flex item and overflow, so use vw */
  @media (max-width: 640px) {
    .lockup {
      width: calc(100vw - 2 * var(--gutter));
      width: min(calc(100vw - 2 * var(--gutter)), calc((100svh - 10rem) * 2.197));
    }
    footer { gap: 0.5rem 1rem; font-size: 0.75rem; }
  }
</style>
